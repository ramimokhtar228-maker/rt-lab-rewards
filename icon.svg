<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="488" height="488" x="12" y="12" rx="100" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Inner Glowing Shield -->
  <path d="M256 70 C330 70 380 90 400 110 C400 230 360 360 256 420 C152 360 112 230 112 110 C132 90 182 70 256 70 Z" 
        fill="#022c22" stroke="url(#gold)" stroke-width="8" filter="url(#shadow)"/>

  <!-- Medical Cross / Shield Symbol inside -->
  <rect x="236" y="140" width="40" height="120" rx="12" fill="url(#gold)"/>
  <rect x="196" y="180" width="120" height="40" rx="12" fill="url(#gold)"/>

  <!-- RT Monogram -->
  <text x="256" y="325" font-family="'Cairo', 'Arial Black', sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#shadow)">
    RT LAB
  </text>
  <text x="256" y="365" font-family="'Cairo', sans-serif" font-weight="700" font-size="24" fill="#6ee7b7" text-anchor="middle">
    معامل التحاليل الطبية
  </text>

  <!-- Stars / Sparkles -->
  <polygon points="256,92 262,106 276,108 266,118 269,132 256,124 243,132 246,118 236,108 250,106" fill="url(#gold)"/>
  <circle cx="150" cy="150" r="8" fill="#fef08a"/>
  <circle cx="362" cy="150" r="8" fill="#fef08a"/>
</svg>
