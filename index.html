    <!-- Smart Cache & URL Parameter Pre-Syncing -->
    <script>
      (function() {
        try {
          // 1. Immediately unregister any legacy service workers on client devices
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            });
          }

          // 2. Clear all stale Service Worker and HTTP caches
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            });
          }

          // 3. Purge old stale storage keys to guarantee fresh official data load
          var legacyKeys = [
            'rt_lab_settings',
            'rt_lab_settings_v1',
            'rt_lab_settings_v2',
            'rt_lab_questions',
            'rt_lab_questions_v1',
            'rt_lab_questions_v2',
            'rt_lab_rewards',
            'rt_lab_rewards_v1',
            'rt_lab_rewards_v2',
            'rt_lab_spin_slices_v1',
            'rt_lab_spin_slices_v2',
            'rt_lab_leaderboard_v1',
            'rt_lab_leaderboard_v2'
          ];
          for (var j = 0; j < legacyKeys.length; j++) {
            try { localStorage.removeItem(legacyKeys[j]); } catch(e) {}
          }

          // 4. If URL has smart parameters, persist them safely into current settings
          var params = new URLSearchParams(window.location.search);
          var wa = params.get('wa');
          var hotline = params.get('hotline');
          if (wa || hotline) {
            var raw = localStorage.getItem('rt_lab_settings_v3_official');
            var s = raw ? JSON.parse(raw) : {};
            if (wa) s.whatsappNumber = wa;
            if (hotline) s.hotlineNumber = hotline;
            localStorage.setItem('rt_lab_settings_v3_official', JSON.stringify(s));
          }
        } catch (e) {
          console.error('Pre-sync error:', e);
        }
      })();
    </script>
